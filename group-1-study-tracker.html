<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7f4">
<title>Study Notes · CA Inter Group 1</title>
<style>
:root{--bg:#fbf7f4;--paper:#fffdfb;--soft:#f3e9e5;--ink:#342b2b;--muted:#817573;--accent:#a96e79;--accent2:#d8a8a9;--sage:#718478;--line:#e9dfda;--gold:#c5a66b;--shadow:0 12px 35px rgba(75,52,49,.07);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);color-scheme:light;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}body{margin:0;background:var(--bg);font-size:15px;line-height:1.55}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:3px solid #d5a2ab;outline-offset:2px}header{max-width:1000px;margin:0 auto;padding:2.2rem 1.25rem 1rem}.eyebrow{color:var(--accent);font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}.heading h1{font-family:Georgia,serif;font-size:clamp(2rem,6vw,3.35rem);font-weight:400;line-height:1.08;letter-spacing:-.04em;margin:.35rem 0}.heading p{margin:.4rem 0;color:var(--muted)}.mark{width:46px;height:46px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:1.2rem;flex:0 0 auto;background:var(--paper)}
.nav{display:flex;gap:.5rem;max-width:1000px;margin:.5rem auto 1.2rem;padding:0 1.25rem}.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.55rem 1rem;color:var(--muted);transition:background .2s,color .2s,transform .2s,border-color .2s}.tab:hover{transform:translateY(-2px);border-color:var(--accent2)}.tab[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.wrap{max-width:1000px;margin:auto;padding:0 1.25rem 3rem}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:1.1rem;box-shadow:var(--shadow)}.page-in{animation:page-in .38s cubic-bezier(.2,.75,.25,1) both}@keyframes page-in{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:translateY(0) scale(1)}}.card h2{font-family:Georgia,serif;font-weight:400;font-size:1.5rem;margin:0 0 .7rem}.profile{text-align:center}.avatar{width:100px;height:100px;border-radius:50%;margin:.2rem auto .8rem;background:var(--soft);overflow:hidden;display:grid;place-items:center;color:var(--accent);font-size:2rem;cursor:pointer;border:2px solid var(--line)}.avatar img{width:100%;height:100%;object-fit:cover}.profile-name{font-family:Georgia,serif;font-size:1.4rem}.subtext,.hint{color:var(--muted);font-size:.9rem}.hint{margin:.3rem 0}.profile input[type=file]{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem}.stat{background:var(--bg);border-radius:12px;padding:.65rem .35rem}.stat b{display:block;font-family:Georgia,serif;font-size:1.25rem;font-weight:400;color:var(--accent)}.stat span{font-size:.75rem;color:var(--muted)}.progress{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;margin:.5rem 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width .3s}.subject-list{display:grid;gap:.65rem}.subject-link{width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:.8rem .9rem;display:grid;grid-template-columns:1fr auto;gap:.35rem .8rem;align-items:center;transition:transform .2s,border-color .2s,box-shadow .2s}.subject-link:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 8px 20px rgba(75,52,49,.07)}.subject-link strong{font-weight:600}.subject-link small{color:var(--muted)}.subject-link .progress{grid-column:1/-1;margin:0}.sec{font-family:Georgia,serif;font-weight:400;font-size:1.65rem;margin:1.5rem 0 .75rem}.pills{display:flex;gap:.5rem;flex-wrap:wrap;margin:.2rem 0 1rem}.pill,.ghost,.primary{border:1px solid var(--line);border-radius:999px;background:var(--paper);padding:.48rem .85rem;transition:transform .18s,background .18s,border-color .18s}.pill:hover,.ghost:hover,.primary:hover{transform:translateY(-1px)}.pill[aria-pressed=true]{background:var(--soft);border-color:var(--accent2);color:#71464f}.primary{background:var(--accent);border-color:var(--accent);color:white}.subject-head{display:flex;justify-content:space-between;align-items:center;gap:.8rem}.subject-head h2{margin:0}.columns,.chapter{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,2.6rem) 1.6rem;gap:.35rem;align-items:center}.columns{color:var(--muted);font-size:.73rem;text-align:center;padding:.3rem 0}.chapter{border-top:1px solid var(--line);padding:.42rem 0}.chapter-name{overflow-wrap:anywhere;border-radius:4px}.coin{width:2rem;height:2rem;border:1px solid var(--line);border-radius:50%;background:transparent;justify-self:center;padding:0;color:white;transition:transform .2s,background .2s}.coin:hover{transform:scale(1.08)}.coin.on{background:var(--sage);border-color:var(--sage);animation:coin-pop .28s ease-out}@keyframes coin-pop{50%{transform:scale(1.18)}}.remove{border:0;background:none;color:var(--muted);font-size:1.15rem}.remove:hover{color:#a24351}.add{display:flex;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}input[type=text],input:not([type]){flex:1 1 12rem;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:.55rem .75rem}.danger{color:#9a4b55}.list-item{display:grid;grid-template-columns:2rem 1fr 1.5rem;gap:.6rem;align-items:center;border-top:1px solid var(--line);padding:.55rem 0}.done{text-decoration:line-through;opacity:.55}.empty{padding:.8rem 0}.fineprint{margin:1rem 0 0;color:var(--muted);font-size:.8rem}@media(max-width:680px){.grid{grid-template-columns:1fr}.heading{align-items:center}.columns,.chapter{grid-template-columns:minmax(0,1fr) repeat(3,2.25rem) 1.3rem;gap:.2rem}.nav{overflow:auto}.tab{white-space:nowrap}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="heading"><div><div class="eyebrow">A little progress, every day</div><h1>Study Notes</h1><p>CA Intermediate · Group 1</p></div><div class="mark" aria-hidden="true">✿</div></div></header>
<nav class="nav" aria-label="Main navigation"><button class="tab" data-action="tab" data-value="home">Overview</button><button class="tab" data-action="tab" data-value="syllabus">Syllabus</button><button class="tab" data-action="tab" data-value="tests">Tests & notes</button></nav>
<main class="wrap" id="app"></main>
<script>
const KEY='ca-inter-group1-minimal-v1', LABELS=['Study','Revision 1','Revision 2'];
const seed=[
 {n:'Advanced Accounting',ch:['Introduction to Accounting Standards','Framework for Preparation and Presentation of Financial Statements','Applicability of Accounting Standards','AS 1 – Disclosure of Accounting Policies','AS 2 – Valuation of Inventories','AS 3 – Cash Flow Statements','AS 4 – Contingencies and Events Occurring After the Balance Sheet Date','AS 5 – Net Profit or Loss for the Period, Prior Period Items and Changes in Accounting Policies','AS 7 – Construction Contracts','AS 9 – Revenue Recognition','AS 10 – Property, Plant and Equipment','AS 11 – The Effects of Changes in Foreign Exchange Rates','AS 12 – Accounting for Government Grants','AS 13 – Accounting for Investments','AS 14 – Accounting for Amalgamations','AS 15 – Employee Benefits','AS 16 – Borrowing Costs','AS 17 – Segment Reporting','AS 18 – Related Party Disclosures','AS 19 – Leases','AS 20 – Earnings Per Share','AS 21 – Consolidated Financial Statements','AS 22 – Accounting for Taxes on Income','AS 23 – Accounting for Investments in Associates in Consolidated Financial Statements','AS 24 – Discontinuing Operations','AS 25 – Interim Financial Reporting','AS 26 – Intangible Assets','AS 27 – Financial Reporting of Interests in Joint Ventures','AS 28 – Impairment of Assets','AS 29 – Provisions, Contingent Liabilities and Contingent Assets','Financial Statements of Companies','Buyback of Securities','Amalgamation of Companies','Internal Reconstruction','Accounting for Branches including Foreign Branches']},
 {n:'Corporate and Other Laws',ch:['Preliminary','Incorporation of Company and Matters Incidental Thereto','Prospectus and Allotment of Securities','Share Capital and Debentures','Acceptance of Deposits by Companies','Registration of Charges','Management & Administration','Declaration and Payment of Dividend','Accounts of Companies','Audit and Auditors','Companies Incorporated Outside India','The Limited Liability Partnership Act, 2008','The General Clauses Act, 1897','Interpretation of Statutes','The Foreign Exchange Management Act, 1999']},
 {n:'Taxation · Income-tax Law',ch:['Basic Concepts','Residential Status and Scope of Total Income','Heads of Income: Salaries','Heads of Income: Income from House Property','Heads of Income: Profits and Gains of Business or Profession','Heads of Income: Capital Gains','Heads of Income: Income from Other Sources','Income of Other Persons included in Total Income of Assessee','Set-Off or Carry Forward and Set-off of Losses','Deductions from Gross Total Income','Tax Deduction or Collection at Source and Advance Tax','Provisions for Filing Return of Income and Self Assessment','Income Tax Liability: Computation and Optimisation']},
 {n:'Taxation · GST',ch:['GST in India – An Introduction','Supply under GST','Charge of GST','Place of Supply','Exemptions from GST','Time of Supply','Value of Supply','Input Tax Credit','Registration','Tax Invoice; Credit and Debit Notes','Accounts and Records','E-Way Bill','Payment of Tax','Tax Deduction at Source and Collection of Tax at Source','Returns']}
];
function fresh(){return {name:'Your name',photo:'',tab:'home',subject:0,subjects:seed.map(s=>({n:s.n,ch:s.ch.map(n=>({n,d:[0,0,0]}))})),lists:[{t:'My test series',items:[]}]}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.subjects)){const adv=x.subjects.find(s=>s.n==='Advanced Accounting');if(adv&&x.syllabusVersion!==2){const names=seed[0].ch,old=Array.isArray(adv.ch)?adv.ch:[],base=['Introduction to Accounting Standards','Framework for Preparation and Presentation of Financial Statements','Applicability of Accounting Standards','Financial Statements of Companies','Buyback of Securities','Amalgamation of Companies','Internal Reconstruction','Accounting for Branches including Foreign Branches'];const byName=new Map(old.map(c=>[c.n,c]));const kept=old.filter(c=>!['Presentation & Disclosures Based Accounting Standards','Assets Based Accounting Standards','Liabilities Based Accounting Standards','Accounting Standards Based on Items Impacting Financial Statements','Revenue Based Accounting Standards','Other Accounting Standards','Accounting Standards for Consolidated Financial Statements'].includes(c.n)&&!base.includes(c.n)&&!names.includes(c.n));adv.ch=[...names.map(n=>byName.get(n)||{n,d:[0,0,0]}),...kept];x.syllabusVersion=2;try{localStorage.setItem(KEY,JSON.stringify(x))}catch(e){}}return x}}catch(e){}const x=fresh();x.syllabusVersion=2;return x}
let state=load();const $=s=>document.getElementById(s),esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const all=()=>state.subjects.flatMap(s=>s.ch), percent=ch=>{let n=ch.length*3;return n?Math.round(ch.reduce((a,c)=>a+c.d.reduce((x,y)=>x+y,0),0)*100/n):0}, count=(ch,k)=>ch.filter(c=>c.d[k]).length;
function overview(){const chapters=all(),p=percent(chapters);return `<section class="grid"><div class="card profile"><label class="avatar" for="photo" tabindex="0" aria-label="Choose a profile photo">${state.photo?`<img src="${state.photo}" alt="Profile photo">`:'✿'}</label><input id="photo" type="file" accept="image/*"><div class="profile-name" contenteditable="true" data-edit="name">${esc(state.name)}</div><p class="subtext">CA Intermediate · Group 1</p><h2 style="margin-top:1.2rem">Overall progress</h2><div class="progress"><i style="width:${p}%"></i></div><p class="hint">${p}% of your study and revision ticks complete</p><div class="stats">${LABELS.map((l,k)=>`<div class="stat"><b>${count(chapters,k)}</b><span>${l}</span></div>`).join('')}</div></div><div><h2 class="sec" style="margin-top:0">Your subjects</h2><div class="subject-list">${state.subjects.map((s,i)=>`<button class="subject-link" data-action="open-subject" data-index="${i}"><strong>${esc(s.n)}</strong><small>${percent(s.ch)}%</small><div class="progress"><i style="width:${percent(s.ch)}%"></i></div></button>`).join('')}</div><p class="fineprint">A calm place to keep track of what you’ve studied and revised. Your progress is saved in this browser.</p></div></section>`}
function syllabus(){const s=state.subjects[state.subject]||state.subjects[0];if(!s)return '<div class="card">Add a subject to begin.</div>';return `<div class="pills">${state.subjects.map((x,i)=>`<button class="pill" data-action="subject" data-index="${i}" aria-pressed="${i===state.subject}">${esc(x.n)}</button>`).join('')}<button class="pill" data-action="add-subject">+ Add subject</button></div><section class="card"><div class="subject-head"><h2 contenteditable="true" data-edit="subject">${esc(s.n)}</h2><button class="ghost danger" data-action="delete-subject">Remove subject</button></div><div class="progress"><i style="width:${percent(s.ch)}%"></i></div><p class="hint">Tap a chapter title to rename it. Mark Study, then each revision as you complete it.</p><div class="columns"><span></span>${LABELS.map(x=>`<span>${x}</span>`).join('')}<span></span></div>${s.ch.map((c,i)=>`<div class="chapter"><span class="chapter-name" contenteditable="true" data-edit="chapter" data-chapter="${i}">${esc(c.n)}</span>${c.d.map((v,k)=>`<button class="coin${v?' on':''}" data-action="tick" data-chapter="${i}" data-kind="${k}" aria-pressed="${!!v}" aria-label="${esc(c.n)} ${LABELS[k]}">${v?'✓':''}</button>`).join('')}<button class="remove" data-action="delete-chapter" data-chapter="${i}" aria-label="Remove chapter">×</button></div>`).join('')||'<p class="hint empty">No chapters yet. Add one below.</p>'}<div class="add"><input data-add type="text" placeholder="Add a chapter" aria-label="New chapter name"><button class="primary" data-action="add-chapter">Add chapter</button></div></section>`}
function tests(){return `<p class="hint" style="margin:.5rem 0 1rem">Keep your test papers, marks, goals, or notes here. Edit any text and tick entries when they’re done.</p>${state.lists.map((L,l)=>`<section class="card" style="margin-bottom:1rem"><div class="subject-head"><h2 contenteditable="true" data-edit="list-title" data-list="${l}">${esc(L.t)}</h2><button class="ghost danger" data-action="delete-list" data-list="${l}">Delete list</button></div>${L.items.map((it,i)=>`<div class="list-item"><button class="coin${it.d?' on':''}" data-action="tick-item" data-list="${l}" data-item="${i}" aria-pressed="${!!it.d}">${it.d?'✓':''}</button><span class="${it.d?'done':''}" contenteditable="true" data-edit="item" data-list="${l}" data-item="${i}">${esc(it.x)}</span><button class="remove" data-action="delete-item" data-list="${l}" data-item="${i}" aria-label="Remove entry">×</button></div>`).join('')||'<p class="hint empty">Nothing here yet. Add your first entry below.</p>'}<div class="add"><input data-add type="text" placeholder="e.g. Mock test 1 – 58/100"><button class="primary" data-action="add-item" data-list="${l}">Add</button></div></section>`).join('')}<button class="primary" data-action="add-list">+ New list</button>`}
function render(animate=false){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.value===state.tab));$('app').innerHTML=state.tab==='home'?overview():state.tab==='syllabus'?syllabus():tests();if(animate){$('app').classList.remove('page-in');void $('app').offsetWidth;$('app').classList.add('page-in')}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const d=b.dataset,a=d.action,s=state.subjects[state.subject]||state.subjects[0];if(a==='tab'){if(state.tab===d.value)return;state.tab=d.value;save();render(true);scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}if(a==='open-subject'){state.subject=+d.index;state.tab='syllabus';save();render(true);scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});return}else if(a==='subject'){state.subject=+d.index}else if(a==='tick'){const v=s.ch[+d.chapter].d;v[+d.kind]=v[+d.kind]?0:1}else if(a==='delete-chapter'){s.ch.splice(+d.chapter,1)}else if(a==='add-chapter'){const input=b.previousElementSibling,v=input.value.trim();if(!v)return;s.ch.push({n:v,d:[0,0,0]})}else if(a==='add-subject'){state.subjects.push({n:'New subject',ch:[]});state.subject=state.subjects.length-1}else if(a==='delete-subject'){if(state.subjects.length>1){state.subjects.splice(state.subject,1);state.subject=0}}else if(a==='add-list'){state.lists.push({t:'New list',items:[]})}else if(a==='delete-list'){state.lists.splice(+d.list,1)}else if(a==='add-item'){const input=b.previousElementSibling,v=input.value.trim();if(!v)return;state.lists[+d.list].items.push({x:v,d:0})}else if(a==='delete-item'){state.lists[+d.list].items.splice(+d.item,1)}else if(a==='tick-item'){const it=state.lists[+d.list].items[+d.item];it.d=it.d?0:1}else return;save();render()});
document.addEventListener('focusout',e=>{const t=e.target,d=t.dataset;if(!d.edit)return;const v=t.textContent.trim();if(d.edit==='name')state.name=v||'Your name';if(d.edit==='subject')state.subjects[state.subject].n=v||'Subject';if(d.edit==='chapter')state.subjects[state.subject].ch[+d.chapter].n=v||'Untitled';if(d.edit==='list-title')state.lists[+d.list].t=v||'List';if(d.edit==='item')state.lists[+d.list].items[+d.item].x=v;save()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.isContentEditable){e.preventDefault();e.target.blur()}else if(e.key==='Enter'&&e.target.matches('[data-add]'))e.target.nextElementSibling.click();else if(e.key==='Enter'&&e.target.matches('.avatar'))$('photo').click()});
document.addEventListener('change',e=>{if(e.target.id!=='photo'||!e.target.files[0])return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=240;c.height=240;const x=c.getContext('2d'),scale=Math.max(240/img.width,240/img.height),w=img.width*scale,h=img.height*scale;x.drawImage(img,(240-w)/2,(240-h)/2,w,h);state.photo=c.toDataURL('image/jpeg',.82);save();render()};img.src=reader.result};reader.readAsDataURL(e.target.files[0])});
render();
</script>
</body>
</html>
